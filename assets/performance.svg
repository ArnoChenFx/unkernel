<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" width="800" height="484" role="img" aria-labelledby="title desc">
  <!-- SPDX-License-Identifier: GPL-2.0-or-later -->
  <!-- Copyright (C) 2026 Pooya Parsa <pooya@pi0.io> -->
  <title id="title">How fast unkernel's syscalls and fork are</title>
  <desc id="desc">Time per operation, lower is faster, measured under Node. getppid: native 110 ns, qemu-user 320 ns, qemu-system 1662 ns, unkernel 172 ns. read 64 B from /dev/zero: native 161 ns, qemu-user 481 ns, qemu-system 2247 ns, unkernel 172 ns. pipe write + read: native 417 ns, qemu-user 1032 ns, qemu-system 7256 ns, unkernel 482 ns. fork + exit + wait: native 73 µs, qemu-user 537 µs, qemu-system 1178 µs, unkernel 57 µs.</desc>
  <style>
    svg { --card: #ffffff; --stroke: #e2e8f0; --text: #0f172a; --muted: #64748b; --bar: #cbd5e1; --us: #16a34a; --shadow: 0.07; }
    @media (prefers-color-scheme: dark) { svg { --card: #161b22; --stroke: #30363d; --text: #e6edf3; --muted: #9198a1; --bar: #484f58; --us: #3fb950; --shadow: 0; } }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .heading { font-size: 17px; font-weight: 600; }
    .sub { font-size: 13px; fill: var(--muted); }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 12.5px; fill: var(--muted); }
    .value { font-size: 12.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
    .strong { fill: var(--text); font-weight: 600; }
    .card { fill: var(--card); stroke: var(--stroke); stroke-width: 1; }
    .bar { fill: var(--bar); }
    .bar-us { fill: var(--us); }
    .shadow { flood-color: #0f172a; flood-opacity: var(--shadow); }
  </style>
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow class="shadow" dx="0" dy="1" stdDeviation="2"/>
    </filter>
  </defs>

  <text class="heading" x="40" y="34">Time per operation, lower is faster</text>
  <text class="sub" x="40" y="56">Measured under Node. Each panel has its own scale.</text>

  <!-- getppid -->
  <rect class="card" x="40" y="76" width="350" height="184" rx="14" filter="url(#shadow)"/>
  <text class="title mono" x="60" y="108">getppid</text>
  <text class="label" x="60" y="141">native</text>
  <path class="bar" d="M156,130 H162.1 Q166.1,130 166.1,134 V140 Q166.1,144 162.1,144 H156 Z"/>
  <text class="value" x="174.1" y="141">110 ns</text>
  <text class="label" x="60" y="171">qemu-user</text>
  <path class="bar" d="M156,160 H181.3 Q185.3,160 185.3,164 V170 Q185.3,174 181.3,174 H156 Z"/>
  <text class="value" x="193.3" y="171">320 ns</text>
  <text class="label" x="60" y="201">qemu-system</text>
  <path class="bar" d="M156,190 H304 Q308,190 308,194 V200 Q308,204 304,204 H156 Z"/>
  <text class="value" x="316" y="201">1,662 ns</text>
  <text class="label strong" x="60" y="231">unkernel</text>
  <path class="bar-us" d="M156,220 H167.7 Q171.7,220 171.7,224 V230 Q171.7,234 167.7,234 H156 Z"/>
  <text class="value strong" x="179.7" y="231">172 ns</text>

  <!-- read 64 B from /dev/zero -->
  <rect class="card" x="410" y="76" width="350" height="184" rx="14" filter="url(#shadow)"/>
  <text class="title" x="430" y="108">read 64 B from /dev/zero</text>
  <text class="label" x="430" y="141">native</text>
  <path class="bar" d="M526,130 H532.9 Q536.9,130 536.9,134 V140 Q536.9,144 532.9,144 H526 Z"/>
  <text class="value" x="544.9" y="141">161 ns</text>
  <text class="label" x="430" y="171">qemu-user</text>
  <path class="bar" d="M526,160 H554.5 Q558.5,160 558.5,164 V170 Q558.5,174 554.5,174 H526 Z"/>
  <text class="value" x="566.5" y="171">481 ns</text>
  <text class="label" x="430" y="201">qemu-system</text>
  <path class="bar" d="M526,190 H674 Q678,190 678,194 V200 Q678,204 674,204 H526 Z"/>
  <text class="value" x="686" y="201">2,247 ns</text>
  <text class="label strong" x="430" y="231">unkernel</text>
  <path class="bar-us" d="M526,220 H533.6 Q537.6,220 537.6,224 V230 Q537.6,234 533.6,234 H526 Z"/>
  <text class="value strong" x="545.6" y="231">172 ns</text>

  <!-- pipe write + read -->
  <rect class="card" x="40" y="280" width="350" height="184" rx="14" filter="url(#shadow)"/>
  <text class="title" x="60" y="312">pipe write + read</text>
  <text class="label" x="60" y="345">native</text>
  <path class="bar" d="M156,334 H160.7 Q164.7,334 164.7,338 V344 Q164.7,348 160.7,348 H156 Z"/>
  <text class="value" x="172.7" y="345">417 ns</text>
  <text class="label" x="60" y="375">qemu-user</text>
  <path class="bar" d="M156,364 H173.6 Q177.6,364 177.6,368 V374 Q177.6,378 173.6,378 H156 Z"/>
  <text class="value" x="185.6" y="375">1,032 ns</text>
  <text class="label" x="60" y="405">qemu-system</text>
  <path class="bar" d="M156,394 H304 Q308,394 308,398 V404 Q308,408 304,408 H156 Z"/>
  <text class="value" x="316" y="405">7,256 ns</text>
  <text class="label strong" x="60" y="435">unkernel</text>
  <path class="bar-us" d="M156,424 H162.1 Q166.1,424 166.1,428 V434 Q166.1,438 162.1,438 H156 Z"/>
  <text class="value strong" x="174.1" y="435">482 ns</text>

  <!-- fork + exit + wait -->
  <rect class="card" x="410" y="280" width="350" height="184" rx="14" filter="url(#shadow)"/>
  <text class="title" x="430" y="312">fork + exit + wait</text>
  <text class="label" x="430" y="345">native</text>
  <path class="bar" d="M526,334 H531.4 Q535.4,334 535.4,338 V344 Q535.4,348 531.4,348 H526 Z"/>
  <text class="value" x="543.4" y="345">73 µs</text>
  <text class="label" x="430" y="375">qemu-user</text>
  <path class="bar" d="M526,364 H591.3 Q595.3,364 595.3,368 V374 Q595.3,378 591.3,378 H526 Z"/>
  <text class="value" x="603.3" y="375">537 µs</text>
  <text class="label" x="430" y="405">qemu-system</text>
  <path class="bar" d="M526,394 H674 Q678,394 678,398 V404 Q678,408 674,408 H526 Z"/>
  <text class="value" x="686" y="405">1,178 µs</text>
  <text class="label strong" x="430" y="435">unkernel</text>
  <path class="bar-us" d="M526,424 H529.4 Q533.4,424 533.4,428 V434 Q533.4,438 529.4,438 H526 Z"/>
  <text class="value strong" x="541.4" y="435">57 µs</text>
</svg>
