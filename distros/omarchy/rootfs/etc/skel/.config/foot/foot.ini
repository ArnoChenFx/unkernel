# ~/.config/foot/foot.ini of the Omarchy image: the terminal, Tokyo Night
# (night), JetBrains Mono (the image has no Nerd Font).

[main]
font=JetBrains Mono:size=12
pad=14x14 center
term=foot

[scrollback]
lines=20000

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.96
background=1a1b26
foreground=c0caf5
selection-foreground=c0caf5
selection-background=283457
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5
