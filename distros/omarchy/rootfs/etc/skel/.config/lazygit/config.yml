# ~/.config/lazygit/config.yml of the Omarchy image: lazygit in Tokyo Night,
# without icons (no Nerd Font), and without its first-run popups.

disableStartupPopups: true

gui:
  nerdFontsVersion: ""
  showIcons: false
  showRandomTip: false
  border: rounded
  theme:
    activeBorderColor:
      - "#7aa2f7"
      - bold
    inactiveBorderColor:
      - "#565f89"
    optionsTextColor:
      - "#7aa2f7"
    selectedLineBgColor:
      - "#283457"
    cherryPickedCommitBgColor:
      - "#3b4261"
    cherryPickedCommitFgColor:
      - "#bb9af7"
    unstagedChangesColor:
      - "#f7768e"
