# ~/.config/starship.toml of the Omarchy image: the prompt in Tokyo Night. No
# Nerd Font, so no symbols outside plain Unicode.

add_newline = false
format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold #7aa2f7"
truncation_length = 4
truncate_to_repo = true

[git_branch]
style = "bold #bb9af7"
format = "on [$branch]($style) "

[git_status]
style = "#e0af68"
format = '([$all_status$ahead_behind]($style) )'

[cmd_duration]
style = "#565f89"
format = "took [$duration]($style) "
min_time = 2000

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
