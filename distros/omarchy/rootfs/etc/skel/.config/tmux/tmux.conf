# ~/.config/tmux/tmux.conf of the Omarchy image: tmux with the prefix Ctrl-a
# and the Tokyo Night colours.

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm*:RGB,tmux*:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S "
set -g status-left-length 30
set -g status-right "#[fg=#565f89] %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#283457,fg=#7aa2f7,bold] #I #W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#283457,fg=#c0caf5"
setw -g mode-style "bg=#283457,fg=#c0caf5"
