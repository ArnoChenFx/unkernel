# X.Org on the DRM device (the kw layer): the modesetting driver with glamor
# on /dev/dri/card0 (virtio-gpu, present with guest GL), instead of the
# fbdev driver that xorg.conf.d/10-kw-fb.conf names. Not read by default:
#   sudo Xorg :0 -config kw-kms.conf -nolisten tcp &
# (Debian: apt-get install xserver-xorg-core xserver-xorg-input-evdev
# libgl1-mesa-dri libglx-mesa0). The input devices come from
# xorg.conf.d/20-kw-input.conf either way. X draws the pointer itself
# (SWcursor): the host does not show virtio-gpu's cursor plane.
# X does not follow a change of the host's display size by itself: it hears
# of the hotplug only from udev, which the guest does not have. Run a plain
# `xrandr` (it probes) and then `xrandr --output Virtual-1 --auto`, or
# follow the kernel's uevents as the page's X + glamor demo does.

Section "Device"
	Identifier "kms"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/card0"
	Option "AccelMethod" "glamor"
	Option "SWcursor" "true"
EndSection
Section "Screen"
	Identifier "kms"
	Device "kms"
EndSection
Section "ServerLayout"
	Identifier "kms"
	Screen "kms"
EndSection
