# X.Org on the framebuffer (the kw layer, every distro): there is no udev,
# so X cannot find the display or the input devices by itself. With this
# file and 20-kw-input.conf, X with the fbdev and evdev drivers (Alpine:
# apk add xorg-server xf86-video-fbdev xf86-input-evdev) and `X :0` use
# /dev/fb0 (kwfb) and the evdev keyboard, mouse and tablet (kwinput).

Section "ServerFlags"
	Option "AutoAddDevices" "false"
EndSection
Section "Device"
	Identifier "kwfb"
	Driver "fbdev"
EndSection
