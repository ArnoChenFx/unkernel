# X.Org input (10-kw-fb.conf): the evdev keyboard, mouse and tablet
# (kwinput). With the tablet (absolute) open, the page sends the pointer
# there and the host cursor moves in and out of the picture freely; the
# relative mouse stays configured (the page sends it nothing while the
# tablet is open).

Section "InputDevice"
	Identifier "kwinput keyboard"
	Driver "evdev"
	Option "Device" "/dev/input/event0"
	Option "AutoServerLayout" "true"
EndSection
Section "InputDevice"
	Identifier "kwinput mouse"
	Driver "evdev"
	Option "Device" "/dev/input/event1"
	Option "AutoServerLayout" "true"
EndSection
Section "InputDevice"
	Identifier "kwinput tablet"
	Driver "evdev"
	Option "Device" "/dev/input/event2"
	Option "AutoServerLayout" "true"
EndSection
