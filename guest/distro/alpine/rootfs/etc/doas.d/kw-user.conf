# /etc/doas.d/kw-user.conf of the Alpine image (the build makes it 0400):
# the image's user ("user": the console's and kwtty sessions' default)
# runs anything as anyone without a password, also without a terminal
# (sudo -n through doas-sudo-shim, doas -n). ENV makes the busybox ash of
# `sudo -s` read /usr/lib/kw/shrc, as the user's own shells do. root
# too, as sudo lets root: doas has no rule for it otherwise, so a script's
# `sudo cmd` would fail in a root shell.

# unkernel: the image's user is its administrator.
permit nopass setenv { ENV=/usr/lib/kw/shrc } user
permit nopass setenv { ENV=/usr/lib/kw/shrc } root
